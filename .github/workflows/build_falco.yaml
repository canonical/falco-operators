name: Build Falco and falcoctl Binaries

on:
  pull_request:
    branches:
      - main
    paths:
      - ".versions"
      - ".github/scripts/**"
      - ".github/workflows/build_falco.yaml"
      - ".github/workflows/release_falco.yaml"

jobs:
  build-falco:
    name: Build Falco and falcoctl from Source
    runs-on: ["self-hosted", "linux", "amd64", "noble"]
    timeout-minutes: 30
    env:
      ARTIFACT_ROOT: /tmp/artifacts
      FALCO_SOURCE: /tmp/source/falco
      FALCO_GIT_REPO:  "https://github.com/falcosecurity/falco.git"
      FALCO_PLUGINS_SOURCE: /tmp/source/plugins
      FALCO_PLUGINS_GIT_REPO:  "https://github.com/falcosecurity/plugins.git"
      FALCOCTL_SOURCE: /tmp/source/falcoctl
      FALCOCTL_GIT_REPO:  "https://github.com/falcosecurity/falcoctl.git"
      OUTPUT_DIR: ${{ github.workspace }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Extract Falco, falcoctl, and plugin versions
        id: version
        run: ./.github/scripts/extract-versions.sh

      - name: Clone Falco, plugins, and falcoctl source
        env:
          FALCO_VERSION: ${{ steps.version.outputs.falco_version }}
          FALCO_JSON_PLUGIN_VERSION: ${{ steps.version.outputs.json_plugin_version }}
          FALCO_K8SAUDIT_PLUGIN_VERSION: ${{ steps.version.outputs.k8saudit_plugin_version }}
          FALCOCTL_VERSION: ${{ steps.version.outputs.falcoctl_version }}
        run: ./.github/scripts/clone-sources.sh

      - name: Setup Go
        uses: actions/setup-go@v7.1.0
        with:
          cache: false
          go-version: "1.27"

      - name: Install build dependencies
        run: ./.github/scripts/install-build-dependencies.sh

      - name: Build Falco binary
        run: ./.github/scripts/build-falco.sh

      - name: Build Falco plugins
        run: ./.github/scripts/build-falco-plugins.sh

      - name: Build falcoctl binary
        env:
          FALCOCTL_VERSION: ${{ steps.version.outputs.falcoctl_version }}
        run: ./.github/scripts/build-falcoctl.sh

      - name: Prepare artifacts
        run: ./.github/scripts/prepare-artifacts.sh

      - name: Create tarball
        env:
          FALCO_VERSION: ${{ steps.version.outputs.falco_version }}
          ARCH: ${{ steps.version.outputs.arch }}
        run: ./.github/scripts/create-tarball.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: falco-${{ steps.version.outputs.falco_version }}-${{ steps.version.outputs.arch }}
          path: |
            falco-*.tar.gz
          retention-days: 30
