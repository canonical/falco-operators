name: Terraform modules release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "falco-operator/terraform/**"
      - "falcosidekick-k8s-operator/terraform/**"
  push:
    branches:
      - main
    paths:
      - "falco-operator/terraform/**"
      - "falcosidekick-k8s-operator/terraform/**"

jobs:
  falco-terraform:
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_release.yaml@c81a9cdd5acfba473f2f52a4cfbeed7132062df1  # main
    permissions:
      contents: write
    with:
      tag-prefix: falco-operator-tf-
      major-version-file: falco-operator/terraform/MAJOR_VERSION
  falcosidekick-terraform:
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_release.yaml@c81a9cdd5acfba473f2f52a4cfbeed7132062df1  # main
    permissions:
      contents: write
    with:
      tag-prefix: falcosidekick-k8s-operator-tf-
      major-version-file: falcosidekick-k8s-operator/terraform/MAJOR_VERSION
